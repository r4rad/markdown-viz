name: CI

on:
  push:
    branches: [develop, main, 'feat/**']
  pull_request:
    branches: [develop, main]

# No repository secrets required for healthz / stub auth.
# Production Cloud Run can inject FIREBASE_PROJECT_ID and credentials later.
env:
  FIREBASE_AUTH_MODE: stub
  # FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}  # placeholder — unset in CI

jobs:
  spa:
    name: SPA build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:spa
      - run: npm run build

  api:
    name: API build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  collab:
    name: Collab gateway build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/collab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/collab/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
